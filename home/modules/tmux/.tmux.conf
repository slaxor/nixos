# set-hook -g 'after-new-window' 'run "notify-send new-window..."'
# set-hook -g 'before-new-session' 'run "notify-send new-session..."'
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
# bind Right next-window
# bind Left previous-window
bind C-b last-window
bind ` send-key `
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."
bind v paste-buffer
bind-key -T root MouseDown2Pane run-shell 'tmux set-buffer -b x-clip "$(xsel -op)"' \; paste-buffer -b x-clip -d
set-option -g base-index 1
set-option -g bell-action other
set-option -g default-terminal "screen-256color"
set-option -g display-time 1500
set-option -g history-file "${HOME}/.tmux_history"
set-option -g history-limit 500000
set-option -g message-style fg=colour232,bold,bg=colour166
set-option -g mouse on
set-option -g pane-active-border-style fg=colour6,bg=black
set-option -g pane-border-style fg=colour248,bg=black
set-option -g renumber-windows on
set-option -g status-interval 0
set-option -g status-left ''
set-option -g status-left-length 50
set-option -g status-position bottom
set-option -g status-right ''
set-option -g status-right-length 0
set-option -g status-style bg=colour234,dim,fg=colour137
set-option -ga update-environment ' UPTERM_ADMIN_SOCKET'
set-option -ga update-environment ' SSH_AUTH_SOCK'
set-option -ga update-environment ' SSH_AGENT_PID'
set-option -g visual-activity on
set-option -g visual-bell on
set-option -g visual-silence on
set-window-option -g alternate-screen on
set-window-option -g mode-keys vi
set-window-option -g monitor-activity on
set-window-option -g window-status-activity-style "fg=colour12,bg=colour1,bright"
set-window-option -g window-status-bell-style fg=colour255,bold,bg=colour1
set-window-option -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
set-window-option -g window-status-current-style fg=colour81,bold,bg=colour238
set-window-option -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
set-window-option -g window-status-separator "|"
set-window-option -g window-status-style fg=colour138,bg=colour235
