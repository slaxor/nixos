[mgr]
# ratio = [1, 3, 4]
ratio = [0, 5, 5]
sort_by = "natural"
sort_translit = true
show_hidden = true
show_symlink = true
title_format = "{cwd}"
mouse_events = ["click", "scroll", "touch", "move", "drag"]
linemode = "size_and_mtime"

