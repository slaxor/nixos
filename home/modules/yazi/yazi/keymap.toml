[mgr]
prepend_keymap = [
  { on = "<C-d>", run = "plugin diff", desc = "Diff the selected with the hovered file"},
  { on = "+", run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane"},
  { on = "-", run = "plugin toggle-pane min-preview", desc = "Minimize or restore the preview pane"},
  { on = [ "c", "m" ], run = "plugin chmod", desc = "Chmod on selected files"},
  { on  = "<C-m>", run = 'shell --block -- neomutt -a "$@"'},
	{ on = [ "<Up>" ],    run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "<Down>" ],  run = "arrow 1",  desc = "Move cursor down" },
  { on = "<C-o>", run = "shell --block -- /bin/bash -l", desc = "create a subshell"},
  { on = [",", "s"], run = "plugin jump-to-char", desc = "Jump to char"},
]

