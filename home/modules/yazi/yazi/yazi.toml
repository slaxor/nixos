[open]
prepend_rules = [
	{ name = "*.json", use = "edit", run = '$EDITOR "$@"', block = true, for = "unix" },
	{ name = "*.json", use = "open", run = 'jq . "$@"' },
	{ name = "*.pdf", use = "open",  run = 'evince "$@"', block = true, for = "unix" },
	{ name = "*.pdf", use = "edit", run = 'masterpdfeditor5 "$@"', block = true, for = "unix" },
	# Multiple openers for a single rule
	{ name = "*.html", use = [ "open", "edit" ] },
]
append_rules = [
   { name = "*", use = 'e "$@"' },
]

[manager]
prepend_keymap = [
    { on = "T", run = "shell --orphan --confirm kitty", desc = "Open terminal at current dir" },
]

[plugin]
prepend_previewers = [
  { name = "*.md", run = "glow" },
  { mime = "image/heic", run = "heic" },
]

prepend_fetchers = [
  { id = "git", name = "*", run = "git"},
  { id = "git", name = "*/", run = "git"},
#   { id = "mime", name = "*", run = "mime-ext", prio = "high"},
]
